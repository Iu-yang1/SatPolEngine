name: SGP4 Vallado cross-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orbit-crosscheck.yml'
      - 'src/main/kotlin/org/satpol/orbit/**'
      - 'research/orbit_crosscheck.py'
      - 'build.gradle.kts'
permissions:
  contents: read
jobs:
  sgp4-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sgp4
      - run: python research/orbit_crosscheck.py
