name: Official IRI-2026 + NOAA GloTEC fusion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iri2026-glotec.yml'
      - 'research/iri2026/**'
      - 'research/observations/fuse_official_iri_glotec.py'
      - 'research/observations/fuse_iri_glotec.py'
      - 'research/observations/glotec-2026-10-20.example.json'
      - 'src/main/kotlin/org/satpol/ObservedFaradayCli.kt'
      - 'build.gradle.kts'
permissions:
  contents: read
jobs:
  official-observation-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data-analysis and Fortran dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran unzip
          python -m pip install numpy scipy xarray netcdf4
      - name: Build actual official IRI model
        run: bash research/iri2026/build_official.sh "$RUNNER_TEMP/iri2026"
      - name: Evaluate IRI-2026 along historical LEO propagation ray
        run: |
          python research/iri2026/export_official_path.py \
            research/observations/glotec-2026-10-20.example.json \
            "$(cat "$RUNNER_TEMP/iri2026/executable.path")" official-profile.tsv
          test -s official-profile.f2.json
      - name: Fetch genuine NOAA observation model
        run: |
          python research/observations/inspect_glotec.py 2026-10-20 "$RUNNER_TEMP/glotec.nc" > archive-schema.json
      - name: Fuse official physical model with matching NOAA observations
        run: |
          set -o pipefail
          python research/observations/fuse_official_iri_glotec.py \
            official-profile.tsv official-profile.f2.json "$RUNNER_TEMP/glotec.nc" \
            official-fused-profile.tsv | tee official-fusion-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('official-fusion-report.json').read_text())
          assert r['samples']==16
          assert r['minimum_observation_quality']>=2
          assert r['observation_age_minutes']<=20
          assert not r['full_column_TEC_used_as_slant']
          assert Path('official-fused-profile.tsv').read_text().count('\n')==18
          print('Verified official IRI/NOAA fusion report',r)
          PY
      - name: Calculate frequency-dependent Faraday rotation using IGRF-14
        run: |
          gradle --no-daemon -q observedFaraday -PiriOriginal=official-profile.tsv -PiriFused=official-fused-profile.tsv | tee observed-faraday.txt
          python - <<'PY'
          from pathlib import Path
          import math
          rows=[]
          for line in Path('observed-faraday.txt').read_text().splitlines():
              if line.startswith('FARADAY_DATA,'):
                  rows.append(dict(x.split('=',1) for x in line.split(',')[1:]))
          assert len(rows)==2, 'Expected 145/435 MHz integrals'
          a,b=rows
          assert float(a['frequency_mhz'])==145 and float(b['frequency_mhz'])==435
          for prefix in ('iri','fused'):
              lo=float(a[prefix+'_angle_deg'])
              hi=float(b[prefix+'_angle_deg'])
              assert math.isfinite(lo) and math.isfinite(hi) and abs(hi)>1e-8
              assert abs(lo/hi-9.0)<1e-6, (prefix,lo,hi)
              stec_a=float(a[prefix+'_stec_tecu'])
              stec_b=float(b[prefix+'_stec_tecu'])
              assert abs(stec_a-stec_b)<1e-8 and stec_a>0
          assert a['epoch']==b['epoch']=='2026-10-20T12:00:00Z'
          assert abs(float(a['fused_angle_deg'])-float(a['iri_angle_deg']))>1e-8
          print('Official IRI vs real GloTEC corrected IGRF14 Faraday: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-iri2026-noaa-fusion-2026-10-20
          path: |
            official-profile.tsv
            official-profile.f2.json
            official-fused-profile.tsv
            official-fusion-report.json
            archive-schema.json
            observed-faraday.txt
