name: Official IRI-2026 Fortran model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iri2026-official.yml'
      - 'research/iri2026/**'
permissions:
  contents: read
jobs:
  official-iri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official-model prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran unzip
      - name: Retrieve, compile and test official 2026 Fortran source
        run: |
          bash research/iri2026/build_official.sh "$RUNNER_TEMP/iri2026"
          MODEL_DIR="$(dirname "$(cat "$RUNNER_TEMP/iri2026/executable.path")")"
          echo 'IRI-2026 coefficient file header and size:'
          ls -lh "$MODEL_DIR"/igrf2025.dat
          head -n 8 "$MODEL_DIR"/igrf2025.dat
          echo 'Official iritest recommended JF switch defaults:'
          grep -niE 'jf\(|JF\(' "$MODEL_DIR"/iritest.for | head -55 || true
          echo 'Official IRI TCON, READ_IG_RZ metadata:'
          grep -ni -A 90 -B 5 -E '^ *SUBROUTINE TCON|^ *SUBROUTINE READ_IG_RZ' "$MODEL_DIR/irifun.for" | head -195 || true
          echo 'IRI index input status:'
          sed -n '1,5p' "$MODEL_DIR/ig_rz.dat"
          ls -lh "$MODEL_DIR"/IG_RZ.DAT "$MODEL_DIR"/ig_rz.dat
          echo 'IGRF error branch source:'
          grep -ni -B 14 -A 12 'Error while reading' "$MODEL_DIR"/*.for | head -160 || true
          (cd "$MODEL_DIR" && printf '2026 10 20 12.0 0.0 0.0 250.0\n' | ./iri2026-density) | tee /tmp/iri_density_stdout
          grep -E '^SATPOL_NE=' /tmp/iri_density_stdout
          echo 'IGRF-2025 coefficient file:'
          file "$(dirname "$(cat "$RUNNER_TEMP/iri2026/executable.path")")/igrf2025.dat"
          head -n 7 "$(dirname "$(cat "$RUNNER_TEMP/iri2026/executable.path")")/igrf2025.dat"
          echo 'IRI reading error call locations:'
          grep -in -B 5 -A 7 'Error while reading' "$(dirname "$(cat "$RUNNER_TEMP/iri2026/executable.path")")/igrf.for" | head -90 || true
      - name: Export real model densities along a finite research ray
        run: |
          python research/iri2026/export_official_path.py research/iri-request.example.json "$(cat "$RUNNER_TEMP/iri2026/executable.path")" official-iri-samples.tsv
          python - <<'PY'
          from pathlib import Path
          rows=Path('official-iri-samples.tsv').read_text().splitlines()
          assert rows[0].startswith('# source=IRI-2026-official-fortran;')
          assert len(rows)==18
          vals=[float(v.split('\t')[-1]) for v in rows[2:]]
          assert any(x>1e8 for x in vals), vals
          print('Validated official IRI model samples:',len(vals),min(vals),max(vals))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-iri2026-model-samples
          path: official-iri-samples.tsv
