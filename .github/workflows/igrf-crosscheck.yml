name: IGRF-14 independent cross-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/igrf-crosscheck.yml'
      - 'src/main/kotlin/org/satpol/Igrf14.kt'
      - 'src/main/kotlin/org/satpol/IgrfReferenceCli.kt'
      - 'src/main/resources/igrf14-2020-2025-sv.csv'
      - 'research/igrf_crosscheck.py'
      - 'build.gradle.kts'
permissions:
  contents: read
jobs:
  igrf-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ppigrf numpy
      - run: python research/igrf_crosscheck.py
